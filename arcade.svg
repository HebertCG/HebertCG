<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 190" width="1000" height="190" role="img" aria-label="Banner arcade animado">
  <defs>
    <style>
      .fleet  { animation: march 3.2s steps(6) infinite alternate; }
      .ship   { animation: fly 6s ease-in-out infinite alternate; }
      .shot1  { animation: shoot 2.2s linear infinite; }
      .shot2  { animation: shoot 2.2s linear infinite 1.1s; }
      .blink  { animation: blink 1.1s steps(1) infinite; }
      .tw1    { animation: tw 2.4s ease-in-out infinite; }
      .tw2    { animation: tw 3.1s ease-in-out infinite 0.6s; }
      .tw3    { animation: tw 1.9s ease-in-out infinite 1.2s; }

      @keyframes march { from { transform: translateX(-26px); } to { transform: translateX(26px); } }
      @keyframes fly   { from { transform: translateX(-150px); } to { transform: translateX(150px); } }
      @keyframes shoot {
        0%   { transform: translateY(0);     opacity: 0; }
        6%   { opacity: 1; }
        70%  { transform: translateY(-104px); opacity: 1; }
        76%  { transform: translateY(-104px); opacity: 0; }
        100% { transform: translateY(-104px); opacity: 0; }
      }
      @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0.12; } }
      @keyframes tw    { 0%,100% { opacity: .18; } 50% { opacity: .9; } }

      @media (prefers-reduced-motion: reduce) {
        .fleet, .ship, .shot1, .shot2, .blink, .tw1, .tw2, .tw3 { animation: none; }
        .shot1, .shot2 { opacity: 0; }
      }
    </style>

    <g id="inv">
      <rect x="8"  y="0"  width="4"  height="4"/>
      <rect x="32" y="0"  width="4"  height="4"/>
      <rect x="12" y="4"  width="4"  height="4"/>
      <rect x="28" y="4"  width="4"  height="4"/>
      <rect x="8"  y="8"  width="28" height="4"/>
      <rect x="4"  y="12" width="8"  height="4"/>
      <rect x="16" y="12" width="12" height="4"/>
      <rect x="32" y="12" width="8"  height="4"/>
      <rect x="0"  y="16" width="44" height="4"/>
      <rect x="0"  y="20" width="4"  height="4"/>
      <rect x="8"  y="20" width="28" height="4"/>
      <rect x="40" y="20" width="4"  height="4"/>
      <rect x="0"  y="24" width="4"  height="4"/>
      <rect x="8"  y="24" width="4"  height="4"/>
      <rect x="32" y="24" width="4"  height="4"/>
      <rect x="40" y="24" width="4"  height="4"/>
      <rect x="12" y="28" width="8"  height="4"/>
      <rect x="24" y="28" width="8"  height="4"/>
    </g>

    <g id="ship">
      <rect x="16" y="0"  width="4"  height="4"/>
      <rect x="12" y="4"  width="12" height="4"/>
      <rect x="4"  y="8"  width="28" height="4"/>
      <rect x="0"  y="12" width="36" height="4"/>
    </g>

    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000000" opacity="0.28"/>
    </pattern>
  </defs>

  <rect width="1000" height="190" fill="#0B0F16"/>

  <g fill="#8AA0B8">
    <rect class="tw1" x="80"  y="28"  width="3" height="3"/>
    <rect class="tw2" x="180" y="150" width="3" height="3"/>
    <rect class="tw3" x="300" y="20"  width="3" height="3"/>
    <rect class="tw1" x="700" y="40"  width="3" height="3"/>
    <rect class="tw2" x="840" y="120" width="3" height="3"/>
    <rect class="tw3" x="920" y="60"  width="3" height="3"/>
    <rect class="tw2" x="60"  y="100" width="3" height="3"/>
    <rect class="tw3" x="620" y="160" width="3" height="3"/>
  </g>

  <g class="fleet">
    <g fill="#00FF9C" transform="translate(238,26)">
      <use href="#inv" x="0"/>
      <use href="#inv" x="80"/>
      <use href="#inv" x="160"/>
      <use href="#inv" x="240"/>
      <use href="#inv" x="320"/>
      <use href="#inv" x="400"/>
      <use href="#inv" x="480"/>
    </g>
    <g fill="#58A6FF" transform="translate(238,74)">
      <use href="#inv" x="0"/>
      <use href="#inv" x="80"/>
      <use href="#inv" x="160"/>
      <use href="#inv" x="240"/>
      <use href="#inv" x="320"/>
      <use href="#inv" x="400"/>
      <use href="#inv" x="480"/>
    </g>
  </g>

  <g class="ship">
    <g fill="#E7ECF1" transform="translate(482,140)">
      <use href="#ship"/>
    </g>
    <rect class="shot1" x="498" y="132" width="4" height="12" fill="#00FF9C"/>
    <rect class="shot2" x="498" y="132" width="4" height="12" fill="#58A6FF"/>
  </g>

  <text class="blink" x="500" y="182" text-anchor="middle"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="13" letter-spacing="4" fill="#00FF9C">&#9654; PRESS START</text>

  <rect width="1000" height="190" fill="url(#scan)"/>
</svg>
